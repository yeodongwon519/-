# autoedit configuration. Copy to config.toml and edit.

[stt]
# faster-whisper model size: tiny | base | small | medium | large-v2 | large-v3
model = "large-v3"
language = "ko"
# device: "auto" | "cuda" | "cpu"
device = "auto"
# compute_type: "auto" | "float16" | "int8_float16" | "int8" | "float32"
compute_type = "auto"
# Use Silero VAD to skip silence (recommended).
vad = true
# Beam size for decoding. Higher = slower, more accurate.
beam_size = 5

[retake]
# Words that signal "the previous attempt was a mistake; restart".
triggers = ["다시"]
# Margin (seconds) to subtract from NG start so we don't clip the next word.
pre_margin = 0.15
# Margin (seconds) to subtract from the restart point so we don't include trailing breath.
snap_margin = 0.05
# Hard upper bound: never drop more than this many seconds before the trigger word.
context_seconds_before = 8.0
# Silence (seconds) used as a sentence boundary when alignment is unavailable.
sentence_silence = 0.6

[silence]
# Disabled by default - user can trim further in Premiere.
enable = false
threshold_db = -35.0
max_keep_silence = 0.6

[llm]
# Use Claude API to assist alignment on low-confidence chunks.
enable_alignment_assist = false
model = "claude-opus-4-7"
chunk_seconds = 60

[output]
# FCPXML output format version.
fcpxml_version = "1.10"
# "auto" probes the source video; or specify like "30000/1001", "60000/1001", "30/1".
fps = "auto"
