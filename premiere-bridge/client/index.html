<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>Claude Premiere Bridge</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #1e1e1e;
      color: #e0e0e0;
      margin: 0;
      padding: 10px;
      font-size: 12px;
    }
    h1 { font-size: 14px; margin: 0 0 8px 0; }
    .status {
      padding: 6px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
      font-weight: bold;
    }
    .status.on  { background: #1f6e3f; color: #fff; }
    .status.off { background: #6e1f1f; color: #fff; }
    .path {
      font-size: 10px;
      color: #9a9a9a;
      word-break: break-all;
      margin-bottom: 8px;
    }
    .btns { margin-bottom: 8px; }
    button {
      background: #3a3a3a;
      color: #e0e0e0;
      border: 1px solid #555;
      border-radius: 4px;
      padding: 5px 10px;
      cursor: pointer;
      margin-right: 6px;
    }
    button:hover { background: #4a4a4a; }
    #log {
      background: #121212;
      border: 1px solid #333;
      border-radius: 4px;
      height: 260px;
      overflow-y: auto;
      padding: 6px;
      font-family: Consolas, monospace;
      font-size: 11px;
      white-space: pre-wrap;
    }
    #log div { margin-bottom: 2px; }
    .err { color: #ff7b7b; }
    .ok  { color: #7bff9b; }
  </style>
</head>
<body>
  <h1>🎬 Claude Premiere Bridge</h1>
  <div id="status" class="status off">초기화 중…</div>
  <div class="path" id="watchPath"></div>
  <div class="btns">
    <button id="toggleBtn">일시정지</button>
    <button id="clearBtn">로그 비우기</button>
    <button id="testBtn">연결 테스트</button>
  </div>
  <div id="log"></div>
  <script src="./js/main.js"></script>
</body>
</html>
