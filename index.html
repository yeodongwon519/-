<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MindFlow — 마인드맵 & 메모</title>
<style>
  :root{
    --bg:#f4f6fb;
    --panel:#ffffff;
    --panel-2:#f0f2f8;
    --line:#d5dae6;
    --text:#1f2430;
    --text-soft:#6b7280;
    --accent:#4f6ef7;
    --accent-soft:#e8edff;
    --shadow:0 6px 20px rgba(40,55,100,.10);
    --conn:#b9c2d6;
  }
  html[data-theme="dark"]{
    --bg:#11141c;
    --panel:#1b2030;
    --panel-2:#232a3d;
    --line:#333c54;
    --text:#e8ebf4;
    --text-soft:#9aa3bd;
    --accent:#6d83ff;
    --accent-soft:#2a3358;
    --shadow:0 8px 26px rgba(0,0,0,.45);
    --conn:#465174;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    background:var(--bg); color:var(--text);
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    position:fixed; top:0; left:0; right:0; height:54px; z-index:30;
    display:flex; align-items:center; gap:6px; padding:0 14px;
    background:var(--panel); border-bottom:1px solid var(--line);
    box-shadow:0 1px 0 rgba(0,0,0,.02);
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;margin-right:6px;white-space:nowrap;cursor:default;}
  .brand .dot{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#4f6ef7,#8a5cf6);display:inline-block;}
  .mapname{font-size:13px;color:var(--text-soft);font-weight:500;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .spacer{flex:1;}
  .tool{
    display:inline-flex;align-items:center;gap:6px;
    border:1px solid var(--line); background:var(--panel-2); color:var(--text);
    height:34px; padding:0 11px; border-radius:9px; cursor:pointer; font-size:13px;
    transition:.12s; white-space:nowrap; position:relative;
  }
  .tool:hover{border-color:var(--accent);background:var(--accent-soft);}
  .tool:active{transform:translateY(1px);}
  .tool.icon{padding:0 9px;font-size:15px;}
  .tool:disabled{opacity:.4;cursor:default;}
  .sep{width:1px;height:26px;background:var(--line);margin:0 4px;}
  .swatch{width:18px;height:18px;border-radius:5px;border:2px solid rgba(0,0,0,.08);cursor:pointer;}

  /* dropdown menu */
  .menu{position:absolute;top:42px;right:0;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:180px;display:none;z-index:40;}
  .menu.open{display:block;}
  .menu button{display:flex;align-items:center;gap:9px;width:100%;border:none;background:none;color:var(--text);
    padding:9px 11px;border-radius:7px;cursor:pointer;font-size:13px;text-align:left;}
  .menu button:hover{background:var(--accent-soft);}

  /* ---------- Canvas ---------- */
  #stage{position:fixed;inset:54px 0 0 0;overflow:hidden;cursor:grab;transition:left .22s ease;background:
    radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0);
    background-size:26px 26px;}
  #stage.panning{cursor:grabbing;}
  #world{position:absolute;left:0;top:0;transform-origin:0 0;}
  #links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;}
  #links path{fill:none;stroke:var(--conn);stroke-width:2.4;}

  .node{
    position:absolute;
    width:-webkit-max-content; width:-moz-max-content; width:max-content;
    max-width:260px; min-width:34px;
    padding:9px 14px; border-radius:12px;
    background:var(--panel); color:var(--text);
    border:2px solid var(--line); box-shadow:var(--shadow);
    font-size:14px; line-height:1.35; cursor:default;
    white-space:pre-wrap; word-break:break-word;
    transition:border-color .12s, box-shadow .12s;
  }
  .node.root{font-size:17px;font-weight:700;padding:12px 20px;border-radius:16px;
    background:linear-gradient(135deg,var(--accent),#8a5cf6);color:#fff;border-color:transparent;}
  .node.lvl1{font-weight:600;}
  .node.selected{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow);}
  .node.editing{cursor:text;}
  .node .txt[contenteditable="true"]{outline:none;cursor:text;-webkit-user-select:text;user-select:text;}
  .node .badge{position:absolute;top:-9px;right:-9px;background:var(--panel);border:1px solid var(--line);
    border-radius:50%;width:20px;height:20px;font-size:11px;display:none;align-items:center;justify-content:center;}
  .node.has-note .badge{display:flex;}
  .toggle{position:absolute;width:18px;height:18px;border-radius:50%;
    background:var(--panel);border:2px solid var(--conn);color:var(--text-soft);
    font-size:11px;line-height:14px;text-align:center;cursor:pointer;display:none;z-index:2;font-weight:700;}
  .node.has-children .toggle{display:block;}
  .node.collapsed .toggle{background:var(--accent);color:#fff;border-color:var(--accent);}

  /* ---------- Side panels ---------- */
  .side{position:fixed;top:54px;bottom:0;z-index:25;background:var(--panel);
    display:flex;flex-direction:column;transition:transform .22s ease;}
  #notes{right:0;width:330px;border-left:1px solid var(--line);transform:translateX(100%);box-shadow:-6px 0 24px rgba(0,0,0,.06);}
  #notes.open{transform:translateX(0);}
  #maps{left:0;width:290px;border-right:1px solid var(--line);transform:translateX(-100%);box-shadow:6px 0 24px rgba(0,0,0,.06);}
  #maps.open{transform:translateX(0);}
  .pinbtn{cursor:pointer;color:var(--text-soft);font-size:14px;line-height:1;padding:3px 7px;border-radius:7px;border:1px solid transparent;transition:.12s;}
  .pinbtn:hover{background:var(--panel-2);color:var(--text);}
  .pinbtn.active{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  /* docked (pinned) maps panel: push the canvas instead of overlaying it */
  body.maps-pinned #maps{transform:translateX(0);box-shadow:none;}
  body.maps-pinned #stage{left:290px;}
  body.maps-pinned #hint{left:304px;}
  @media (max-width:680px){ body.maps-pinned #stage{left:0;} }
  .side header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;}
  .side header h3{margin:0;font-size:14px;flex:1;}
  .side header .x{cursor:pointer;color:var(--text-soft);font-size:18px;}
  #noteTitle{font-size:12px;color:var(--text-soft);padding:10px 16px 0;}
  #noteTitle b{color:var(--text);}
  #noteArea{flex:1;margin:10px 16px 16px;resize:none;border:1px solid var(--line);border-radius:10px;
    padding:12px;font-size:14px;line-height:1.6;background:var(--panel-2);color:var(--text);
    font-family:inherit;-webkit-user-select:text;user-select:text;}
  #noteArea:focus{outline:none;border-color:var(--accent);}
  .colorrow{display:flex;gap:8px;padding:0 16px 14px;flex-wrap:wrap;}

  /* map list */
  #mapList{flex:1;overflow:auto;padding:8px;}
  .maprow{display:flex;align-items:center;gap:8px;padding:10px 11px;border-radius:9px;cursor:pointer;border:1px solid transparent;}
  .maprow:hover{background:var(--panel-2);}
  .maprow.active{background:var(--accent-soft);border-color:var(--accent);}
  .maprow .mi{flex:1;min-width:0;}
  .maprow .mt{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .maprow .md{font-size:11px;color:var(--text-soft);margin-top:2px;}
  .maprow .ma{opacity:0;display:flex;gap:2px;transition:.12s;}
  .maprow:hover .ma{opacity:1;}
  .maprow .ma button{border:none;background:none;cursor:pointer;font-size:13px;padding:3px 5px;border-radius:6px;color:var(--text-soft);}
  .maprow .ma button:hover{background:var(--panel);color:var(--text);}
  #newMapBtn{margin:8px;height:38px;border:1px dashed var(--line);background:var(--panel-2);color:var(--text);
    border-radius:9px;cursor:pointer;font-size:13px;}
  #newMapBtn:hover{border-color:var(--accent);background:var(--accent-soft);}

  /* ---------- Hint / zoom ---------- */
  #hint{position:fixed;left:14px;bottom:14px;z-index:20;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:12px;color:var(--text-soft);
    box-shadow:var(--shadow);max-width:340px;line-height:1.7;}
  #hint.shift{left:304px;}
  #hint b{color:var(--text);}
  #hint kbd{background:var(--panel-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;
    padding:1px 6px;font-size:11px;color:var(--text);font-family:inherit;}
  #hint .close{float:right;cursor:pointer;margin-left:8px;}
  #zoombox{position:fixed;right:14px;bottom:14px;z-index:20;display:flex;gap:6px;align-items:center;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:var(--shadow);}
  #zoombox.shift{right:344px;}
  #zoombox button{width:30px;height:30px;border:none;background:var(--panel-2);border-radius:7px;cursor:pointer;color:var(--text);font-size:16px;}
  #zoombox button:hover{background:var(--accent-soft);}
  #zoomval{font-size:12px;color:var(--text-soft);min-width:42px;text-align:center;}

  .file-hidden{display:none;}
  @media (max-width:680px){
    .mapname{display:none;}
    .tool span.lbl{display:none;}
    #notes,#maps{width:100%;}
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="dot"></span>MindFlow</div>
    <button class="tool icon" id="mapsBtn" title="맵 목록">🗂</button>
    <span class="mapname" id="mapNameLabel">맵</span>
    <div class="sep"></div>
    <button class="tool" id="addChild">＋ <span class="lbl">하위</span></button>
    <button class="tool" id="addSibling">↵ <span class="lbl">형제</span></button>
    <button class="tool icon" id="del" title="삭제 (Delete)">🗑</button>
    <div class="sep"></div>
    <button class="tool icon" id="undo" title="실행취소 (Ctrl+Z)">↶</button>
    <button class="tool icon" id="redo" title="다시실행 (Ctrl+Y)">↷</button>
    <button class="tool icon" id="noteBtn" title="메모 (Ctrl+M)">📝</button>
    <button class="tool icon" id="fit" title="화면 맞춤 (F)">⊡</button>
    <div class="spacer"></div>
    <div style="position:relative">
      <button class="tool" id="exportBtn">⬇ <span class="lbl">내보내기</span></button>
      <div class="menu" id="exportMenu">
        <button data-act="png">🖼 PNG 이미지</button>
        <button data-act="svg">🗂 SVG 이미지</button>
        <button data-act="json">📦 JSON (백업)</button>
      </div>
    </div>
    <button class="tool icon" id="importBtn" title="JSON 불러오기">⬆</button>
    <button class="tool icon" id="theme" title="테마 전환">🌗</button>
    <input type="file" id="fileInput" class="file-hidden" accept=".json,application/json" />
  </div>

  <div id="stage">
    <div id="world"><svg id="links"></svg></div>
  </div>

  <!-- Maps panel -->
  <aside id="maps" class="side">
    <header><h3>내 마인드맵</h3><span class="pinbtn" id="pinMaps" title="패널 고정/해제">📌</span><span class="x" id="closeMaps">×</span></header>
    <button id="newMapBtn">＋ 새 마인드맵</button>
    <div id="mapList"></div>
  </aside>

  <!-- Notes panel -->
  <aside id="notes" class="side">
    <header><h3>메모</h3><span class="x" id="closeNote">×</span></header>
    <div id="noteTitle">선택한 주제: <b id="noteFor">—</b></div>
    <div class="colorrow" id="colorRow"></div>
    <textarea id="noteArea" placeholder="이 주제에 대한 메모를 자유롭게 적어보세요…"></textarea>
  </aside>

  <div id="hint">
    <span class="close" id="hintClose">×</span>
    <b>단축키</b><br>
    <kbd>Tab</kbd> 하위 · <kbd>Enter</kbd> 형제 · <kbd>Del</kbd> 삭제<br>
    <kbd>F2</kbd>/더블클릭 편집 · <kbd>Space</kbd> 접기 · <kbd>화살표</kbd> 이동<br>
    <kbd>Ctrl</kbd>+<kbd>Z</kbd> 취소 · 빈 곳 드래그=이동 · 휠=확대
  </div>

  <div id="zoombox">
    <button id="zoomOut">−</button>
    <span id="zoomval">100%</span>
    <button id="zoomIn">＋</button>
    <button id="fitBtn" title="맞춤">⊡</button>
  </div>

<script>
(function(){
  "use strict";

  const COLORS = [
    {name:"기본", v:""},{name:"빨강", v:"#ef4444"},{name:"주황", v:"#f59e0b"},
    {name:"초록", v:"#10b981"},{name:"파랑", v:"#3b82f6"},{name:"보라", v:"#8b5cf6"},
    {name:"분홍", v:"#ec4899"},{name:"청록", v:"#14b8a6"},
  ];

  // ---------- ids ----------
  let uid = 1;
  const newId = () => "n" + (uid++);
  const makeNode = t => ({id:newId(), text:t||"새 주제", note:"", color:"", collapsed:false, side:null, children:[]});
  const mapId = () => "m" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

  // ---------- working state ----------
  let root = null, selectedId = null, view = {x:120,y:0,scale:1};
  const nodeIndex=new Map(), parentIndex=new Map(), elIndex=new Map();

  // ---------- store (multiple maps) ----------
  const STORE='mindflow.store.v2';
  let store = {current:null, order:[], maps:{}};

  const stage=document.getElementById('stage'), world=document.getElementById('world'), svg=document.getElementById('links');
  const notesEl=document.getElementById('notes'), mapsEl=document.getElementById('maps'), noteArea=document.getElementById('noteArea');

  // ---------- history ----------
  let history=[], hpos=-1, suppress=false;
  function snapshot(){
    if(suppress) return;
    const s=JSON.stringify({root,uid});
    if(history[hpos]===s) return;
    history=history.slice(0,hpos+1); history.push(s);
    if(history.length>80) history.shift();
    hpos=history.length-1; updateUndoButtons(); saveCurrent();
  }
  function restore(s){
    const o=JSON.parse(s); root=o.root; uid=o.uid;
    if(!nodeIndex.has(selectedId)) selectedId=root.id;
    reindex(); render(); syncNotes();
  }
  function undo(){ if(hpos>0){hpos--;suppress=true;restore(history[hpos]);suppress=false;updateUndoButtons();saveCurrent();} }
  function redo(){ if(hpos<history.length-1){hpos++;suppress=true;restore(history[hpos]);suppress=false;updateUndoButtons();saveCurrent();} }
  function updateUndoButtons(){
    document.getElementById('undo').disabled=hpos<=0;
    document.getElementById('redo').disabled=hpos>=history.length-1;
  }

  // ---------- indexing ----------
  function reindex(){
    nodeIndex.clear(); parentIndex.clear();
    (function w(n,p){nodeIndex.set(n.id,n);parentIndex.set(n.id,p);n.children.forEach(c=>w(c,n));})(root,null);
  }

  // ---------- persistence ----------
  let saveTimer=null;
  function persist(){ try{ localStorage.setItem(STORE, JSON.stringify(store)); }catch(e){} }
  function saveCurrent(){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>{
      const m=store.maps[store.current]; if(!m) return;
      m.root=root; m.uid=uid; m.view=view; m.updated=Date.now();
      m.name=mapTitle(m);
      persist(); renderMapName(); if(mapsOpen||mapsPinned) renderMapList();
    },200);
  }
  function loadStore(){
    try{ const raw=localStorage.getItem(STORE); if(raw){ const o=JSON.parse(raw); if(o&&o.maps) return o; } }catch(e){}
    try{ const old=localStorage.getItem('mindflow.map.v1'); if(old){ const o=JSON.parse(old); if(o.root){
      const id=mapId(); return {current:id, order:[id], maps:{[id]:{id,name:o.root.text||'마인드맵',root:o.root,uid:o.uid||1,view:o.view||{x:120,y:0,scale:1},updated:Date.now()}}}; } }
    }catch(e){}
    return null;
  }

  function seed(){
    root=makeNode("중심 생각");
    const a=makeNode("아이디어");a.side="right";
    const b=makeNode("할 일");b.side="right";
    const c=makeNode("메모");c.side="left";
    a.children.push(makeNode("세부 1"),makeNode("세부 2"));
    b.children.push(makeNode("오늘"));
    root.children.push(a,b,c);
  }

  // ---------- map management ----------
  function loadMapInto(id){
    const m=store.maps[id]; if(!m) return;
    store.current=id; root=m.root; uid=m.uid||1; view=m.view||{x:120,y:0,scale:1};
    reindex(); selectedId=root.id;
    history=[JSON.stringify({root,uid})]; hpos=0; updateUndoButtons();
    render(); select(root.id); renderMapList(); renderMapName(); persist();
  }
  function createMap(name){
    uid=1; seed(); if(name) root.text=name;
    const id=mapId();
    view={x:0,y:0,scale:1};
    store.maps[id]={id,name:name||root.text,root,uid,view,updated:Date.now()};
    store.order.unshift(id); store.current=id;
    reindex(); selectedId=root.id;
    history=[JSON.stringify({root,uid})]; hpos=0; updateUndoButtons();
    render(); fit(); select(root.id); renderMapList(); renderMapName(); persist();
  }
  function deleteMap(id){
    if(store.order.length<=1){ alert('마지막 맵은 삭제할 수 없어요. 새 맵을 먼저 만들어 주세요.'); return; }
    if(!confirm('이 마인드맵을 삭제할까요? 되돌릴 수 없습니다.')) return;
    delete store.maps[id]; store.order=store.order.filter(x=>x!==id);
    if(store.current===id) loadMapInto(store.order[0]);
    else { renderMapList(); persist(); }
  }
  // The map's name always mirrors its central (root) topic.
  function mapTitle(m){ return (m && m.root && (m.root.text||'').trim()) || '제목 없음'; }
  function renameMap(id){
    const m=store.maps[id]; if(!m) return;
    const name=prompt('중심 주제 이름', (m.root.text||'').trim()); if(name===null) return;
    m.root.text=name.trim()||m.root.text; m.name=mapTitle(m); m.updated=Date.now();
    if(id===store.current){ render(); }
    renderMapList(); renderMapName(); persist();
  }
  function renderMapName(){
    const m=store.maps[store.current];
    document.getElementById('mapNameLabel').textContent = m? mapTitle(m) : '맵';
  }
  function fmtDate(t){
    const d=new Date(t), now=new Date();
    if(d.toDateString()===now.toDateString()) return d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
    return (d.getMonth()+1)+'월 '+d.getDate()+'일';
  }
  function renderMapList(){
    const list=document.getElementById('mapList'); list.innerHTML='';
    store.order.forEach(id=>{
      const m=store.maps[id]; if(!m) return;
      const row=document.createElement('div');
      row.className='maprow'+(id===store.current?' active':'');
      const count=(function c(n){let k=1;n.children.forEach(x=>k+=c(x));return k;})(m.root)-1;
      row.innerHTML=`<span style="font-size:16px">🧠</span>
        <div class="mi"><div class="mt"></div><div class="md">${count}개 주제 · ${fmtDate(m.updated||Date.now())}</div></div>
        <div class="ma"><button data-r title="이름 변경">✎</button><button data-d title="삭제">🗑</button></div>`;
      row.querySelector('.mt').textContent=mapTitle(m);
      row.addEventListener('click',e=>{ if(e.target.closest('.ma')) return; if(id!==store.current) loadMapInto(id); });
      row.querySelector('[data-r]').addEventListener('click',e=>{e.stopPropagation();renameMap(id);});
      row.querySelector('[data-d]').addEventListener('click',e=>{e.stopPropagation();deleteMap(id);});
      list.appendChild(row);
    });
  }

  // ---------- side / direction ----------
  function dirOf(n){
    let cur=n,par=parentIndex.get(cur.id);
    if(!par) return 1;
    while(par&&par!==root){cur=par;par=parentIndex.get(cur.id);}
    return cur.side==='left'?-1:1;
  }
  function pickSide(){ let l=0,r=0; root.children.forEach(c=>c.side==='left'?l++:r++); return l<r?'left':'right'; }

  // ---------- render DOM ----------
  function classFor(n,level){
    let c='node';
    if(n===root)c+=' root'; else if(level===1)c+=' lvl1';
    if(n.id===selectedId)c+=' selected';
    if(n.children.length)c+=' has-children';
    if(n.collapsed&&n.children.length)c+=' collapsed';
    if(n.note&&n.note.trim())c+=' has-note';
    return c;
  }
  function buildDom(){
    const seen=new Set();
    (function w(n,level){
      seen.add(n.id);
      let el=elIndex.get(n.id);
      if(!el){
        el=document.createElement('div'); el.dataset.id=n.id;
        el.innerHTML='<span class="badge">📝</span><span class="toggle"></span><span class="txt"></span>';
        world.appendChild(el); elIndex.set(n.id,el); wireNode(el);
      }
      el.className=classFor(n,level);
      el.querySelector('.txt').textContent=n.text;
      el.querySelector('.toggle').textContent=n.collapsed?'+':'–';
      el.style.borderColor = (n!==root&&n.color)?n.color:'';
      if(!n.collapsed) n.children.forEach(c=>w(c,level+1));
    })(root,0);
    for(const [id,el] of elIndex){ if(!seen.has(id)){el.remove();elIndex.delete(id);} }
  }

  // ---------- layout ----------
  const HGAP=58, VGAP=18;
  function measure(n){ const el=elIndex.get(n.id); n._w=el.offsetWidth; n._h=el.offsetHeight; }
  function subtreeH(n){
    measure(n);
    if(n.collapsed||!n.children.length){n._sh=n._h;return n._sh;}
    let t=0; n.children.forEach((c,i)=>{t+=subtreeH(c); if(i<n.children.length-1)t+=VGAP;});
    n._sh=Math.max(n._h,t); return n._sh;
  }
  function place(n,leftX,cy,dir){
    n._x=leftX; n._y=cy-n._h/2;
    if(n.collapsed||!n.children.length) return;
    let total=0; n.children.forEach((c,i)=>{total+=c._sh; if(i<n.children.length-1)total+=VGAP;});
    let sy=cy-total/2;
    n.children.forEach(c=>{
      const ccy=sy+c._sh/2;
      const cx=dir>0?(leftX+n._w+HGAP):(leftX-HGAP-c._w);
      place(c,cx,ccy,dir); sy+=c._sh+VGAP;
    });
  }
  function layoutSide(list,x,cy,dir){
    let t=0; list.forEach((c,i)=>{t+=c._sh;if(i<list.length-1)t+=VGAP;});
    let sy=cy-t/2; list.forEach(c=>{const ccy=sy+c._sh/2; place(c,dir>0?x:x-c._w,ccy,dir); sy+=c._sh+VGAP;});
  }
  function layout(){
    subtreeH(root); measure(root);
    root._x=-root._w/2; root._y=-root._h/2;
    if(root.collapsed) return;
    const R=root.children.filter(c=>c.side!=='left'), L=root.children.filter(c=>c.side==='left');
    layoutSide(R, root._x+root._w+HGAP, 0, +1);
    layoutSide(L, root._x-HGAP, 0, -1);
  }
  function applyLayout(){
    let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
    elIndex.forEach((el,id)=>{
      const n=nodeIndex.get(id); if(!n) return;
      el.style.left=n._x+'px'; el.style.top=n._y+'px';
      if(n.children.length){
        const dir=n===root?1:dirOf(n);
        const tog=el.querySelector('.toggle');
        tog.style.left=(dir>0?(n._w-2):-16)+'px'; tog.style.right='auto'; tog.style.top=(n._h/2-9)+'px';
      }
      minX=Math.min(minX,n._x);minY=Math.min(minY,n._y);
      maxX=Math.max(maxX,n._x+n._w);maxY=Math.max(maxY,n._y+n._h);
    });
    world._bounds={minX,minY,maxX,maxY};
    drawLinks();
  }
  function computeLinks(){
    const segs=[];
    (function w(n){
      if(n.collapsed) return;
      const dir=n===root?1:dirOf(n);
      n.children.forEach(c=>{
        const cdir=c.side==='left'?-1:(n===root?1:dir);
        const px = (n===root?(cdir>0):(dir>0)) ? n._x+n._w : n._x;
        const py = n._y+n._h/2;
        const cxp = cdir>0 ? c._x : c._x+c._w;
        const cyp = c._y+c._h/2;
        segs.push({px,py,cxp,cyp}); w(c);
      });
    })(root);
    return segs;
  }
  function drawLinks(){
    let d='';
    computeLinks().forEach(s=>{ const mx=(s.px+s.cxp)/2; d+=`M${s.px},${s.py} C${mx},${s.py} ${mx},${s.cyp} ${s.cxp},${s.cyp} `; });
    svg.innerHTML=`<path d="${d}"></path>`;
  }

  function render(){ buildDom(); layout(); applyLayout(); applyView(); }

  // ---------- view ----------
  function applyView(){
    world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.scale})`;
    document.getElementById('zoomval').textContent=Math.round(view.scale*100)+'%';
  }
  function zoomTo(scale,cx,cy){
    scale=Math.min(2.4,Math.max(0.25,scale));
    const r=stage.getBoundingClientRect();
    const sx=(cx-r.left-view.x)/view.scale, sy=(cy-r.top-view.y)/view.scale;
    view.scale=scale; view.x=cx-r.left-sx*scale; view.y=cy-r.top-sy*scale;
    applyView(); saveCurrent();
  }
  function fit(){
    const b=world._bounds; if(!b) return;
    const r=stage.getBoundingClientRect();
    const w=b.maxX-b.minX,h=b.maxY-b.minY,pad=80;
    const scale=Math.min(2,Math.max(.3,Math.min((r.width-pad)/w,(r.height-pad)/h)));
    view.scale=scale; view.x=r.width/2-(b.minX+w/2)*scale; view.y=r.height/2-(b.minY+h/2)*scale;
    applyView(); saveCurrent();
  }

  // ---------- selection ----------
  function select(id){ selectedId=id; elIndex.forEach((el,eid)=>el.classList.toggle('selected',eid===id)); syncNotes(); }

  // ---------- mutations ----------
  function addChild(){
    const p=nodeIndex.get(selectedId); if(!p) return;
    const c=makeNode("새 주제"); if(p===root)c.side=pickSide(); if(p.collapsed)p.collapsed=false;
    p.children.push(c); reindex(); render(); select(c.id); snapshot(); startEdit(c.id,true);
  }
  function addSibling(){
    const n=nodeIndex.get(selectedId); if(!n) return;
    if(n===root){addChild();return;}
    const p=parentIndex.get(n.id), s=makeNode("새 주제");
    if(p===root)s.side=n.side||pickSide();
    p.children.splice(p.children.indexOf(n)+1,0,s);
    reindex(); render(); select(s.id); snapshot(); startEdit(s.id,true);
  }
  function delNode(){
    const n=nodeIndex.get(selectedId); if(!n) return;
    if(n===root){ if(n.children.length&&confirm('중심 주제는 삭제할 수 없습니다. 모든 하위 주제를 삭제할까요?')){n.children=[];reindex();render();select(root.id);snapshot();} return; }
    const p=parentIndex.get(n.id), idx=p.children.indexOf(n);
    p.children.splice(idx,1);
    const next=p.children[idx]||p.children[idx-1]||p;
    reindex(); render(); select(next.id); snapshot();
  }
  function toggleCollapse(n){ if(!n||!n.children.length)return; n.collapsed=!n.collapsed; reindex(); render(); snapshot(); }
  function setColor(v){ const n=nodeIndex.get(selectedId); if(!n||n===root)return; n.color=v; render(); select(n.id); snapshot(); }

  // ---------- inline edit ----------
  let editing=false;
  function startEdit(id,selAll){
    const el=elIndex.get(id); if(!el) return;
    const n=nodeIndex.get(id), txt=el.querySelector('.txt');
    editing=true; el.classList.add('editing'); txt.setAttribute('contenteditable','true'); txt.focus();
    const range=document.createRange(); range.selectNodeContents(txt); if(!selAll)range.collapse(false);
    const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
    function finish(sibling){
      txt.removeAttribute('contenteditable'); el.classList.remove('editing'); editing=false;
      n.text=txt.textContent.trim()||"주제"; txt.textContent=n.text;
      render(); select(id);
      txt.removeEventListener('keydown',onKey); txt.removeEventListener('blur',onBlur);
      snapshot(); if(sibling) addSibling();
    }
    function onKey(e){
      if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();finish(true);}
      else if(e.key==='Escape'){e.preventDefault();finish(false);}
      else if(e.key==='Tab'){e.preventDefault();finish(false);setTimeout(addChild,0);}
      e.stopPropagation();
    }
    function onBlur(){ finish(false); }
    txt.addEventListener('keydown',onKey); txt.addEventListener('blur',onBlur);
  }

  function wireNode(el){
    el.addEventListener('mousedown',e=>{ if(editing)return; e.stopPropagation(); select(el.dataset.id); });
    el.addEventListener('dblclick',e=>{ e.stopPropagation(); startEdit(el.dataset.id,true); });
    el.querySelector('.toggle').addEventListener('mousedown',e=>{ e.stopPropagation();e.preventDefault(); toggleCollapse(nodeIndex.get(el.dataset.id)); select(el.dataset.id); });
  }

  // ---------- navigation ----------
  function navigate(key){
    const n=nodeIndex.get(selectedId); if(!n) return;
    const p=parentIndex.get(n.id), dir=n===root?0:dirOf(n);
    const go=id=>{ if(id){select(id);centerOn(id);} };
    if(key==='ArrowDown'||key==='ArrowUp'){ if(!p)return; const s=p.children,i=s.indexOf(n); const t=key==='ArrowDown'?s[i+1]:s[i-1]; go(t&&t.id); }
    else if(key==='ArrowRight'){ if(n===root){const r=root.children.find(c=>c.side!=='left');go(r&&r.id);} else if(dir>0){if(!n.collapsed&&n.children[0])go(n.children[0].id);} else go(p&&p.id); }
    else if(key==='ArrowLeft'){ if(n===root){const l=root.children.find(c=>c.side==='left');go(l&&l.id);} else if(dir<0){if(!n.collapsed&&n.children[0])go(n.children[0].id);} else go(p&&p.id); }
  }
  function centerOn(id){
    const n=nodeIndex.get(id); if(!n) return;
    const r=stage.getBoundingClientRect(), cx=n._x+n._w/2, cy=n._y+n._h/2;
    const sx=cx*view.scale+view.x, sy=cy*view.scale+view.y, m=60;
    if(sx<m||sx>r.width-m||sy<m||sy>r.height-m){ view.x=r.width/2-cx*view.scale; view.y=r.height/2-cy*view.scale; applyView(); saveCurrent(); }
  }

  // ---------- notes / panels ----------
  function openNotes(){ notesEl.classList.add('open'); document.getElementById('zoombox').classList.add('shift'); syncNotes(); }
  function closeNotes(){ notesEl.classList.remove('open'); document.getElementById('zoombox').classList.remove('shift'); }
  function toggleNotes(){ notesEl.classList.contains('open')?closeNotes():openNotes(); }
  let mapsPinned=false, mapsOpen=false;
  function applyMaps(){
    const visible = mapsOpen || mapsPinned;
    mapsEl.classList.toggle('open', visible);
    document.body.classList.toggle('maps-pinned', mapsPinned);
    document.getElementById('pinMaps').classList.toggle('active', mapsPinned);
    document.getElementById('pinMaps').title = mapsPinned?'고정 해제':'패널 고정';
    document.getElementById('hint').classList.toggle('shift', visible);
  }
  function openMaps(){ mapsOpen=true; renderMapList(); applyMaps(); }
  // X button: fully close AND release the pin. This is the ONLY way a pinned panel closes.
  function closeMaps(){ mapsOpen=false; mapsPinned=false; try{ localStorage.setItem('mindflow.mapsPinned',''); }catch(e){} applyMaps(); }
  function togglePin(){ mapsPinned=!mapsPinned; if(mapsPinned) mapsOpen=true; try{ localStorage.setItem('mindflow.mapsPinned', mapsPinned?'1':''); }catch(e){} if(mapsPinned) renderMapList(); applyMaps(); }
  function syncNotes(){
    const n=nodeIndex.get(selectedId);
    document.getElementById('noteFor').textContent = n?(n.text.length>22?n.text.slice(0,22)+'…':n.text):'—';
    if(n){noteArea.value=n.note||'';noteArea.disabled=false;} else {noteArea.value='';noteArea.disabled=true;}
    document.querySelectorAll('#colorRow .swatch').forEach(s=>{ s.style.outline=(n&&n!==root&&n.color===s.dataset.v)?'2px solid var(--accent)':''; });
  }
  noteArea.addEventListener('input',()=>{ const n=nodeIndex.get(selectedId); if(!n)return; n.note=noteArea.value; const el=elIndex.get(n.id); if(el)el.classList.toggle('has-note',!!n.note.trim()); saveCurrent(); });
  noteArea.addEventListener('blur',snapshot);
  (function(){ const row=document.getElementById('colorRow'); COLORS.forEach(c=>{ const s=document.createElement('div'); s.className='swatch'; s.dataset.v=c.v; s.title=c.name; s.style.background=c.v||'var(--panel-2)'; if(!c.v)s.style.border='2px dashed var(--line)'; s.addEventListener('click',()=>setColor(c.v)); row.appendChild(s); }); })();

  // ---------- pan & zoom ----------
  let panning=false,panStart=null;
  stage.addEventListener('mousedown',e=>{ if(e.target.closest('.node'))return; panning=true; stage.classList.add('panning'); panStart={x:e.clientX-view.x,y:e.clientY-view.y}; closeMenus(); });
  window.addEventListener('mousemove',e=>{ if(!panning)return; view.x=e.clientX-panStart.x; view.y=e.clientY-panStart.y; applyView(); });
  window.addEventListener('mouseup',()=>{ if(panning){panning=false;stage.classList.remove('panning');saveCurrent();} });
  stage.addEventListener('wheel',e=>{ e.preventDefault(); zoomTo(view.scale*(e.deltaY<0?1.12:0.89),e.clientX,e.clientY); },{passive:false});

  // ---------- keyboard ----------
  window.addEventListener('keydown',e=>{
    if(editing) return;
    const tag=(e.target.tagName||'').toLowerCase(); if(tag==='textarea'||tag==='input') return;
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return;}
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='m'){e.preventDefault();toggleNotes();return;}
    if(e.ctrlKey||e.metaKey) return;
    switch(e.key){
      case 'Tab': e.preventDefault(); addChild(); break;
      case 'Enter': e.preventDefault(); addSibling(); break;
      case 'Delete': case 'Backspace': e.preventDefault(); delNode(); break;
      case 'F2': e.preventDefault(); startEdit(selectedId,true); break;
      case ' ': e.preventDefault(); toggleCollapse(nodeIndex.get(selectedId)); break;
      case 'ArrowUp': case 'ArrowDown': case 'ArrowLeft': case 'ArrowRight': e.preventDefault(); navigate(e.key); break;
      case 'f': case 'F': fit(); break;
      default:
        // Begin editing on any printable key (incl. IME composition keys).
        // We consume this keystroke to enter the editor first so the Korean IME
        // is bound to the focused field; the existing text is selected so the
        // next character the user types replaces it — no stray English leaks in.
        if(!e.ctrlKey && !e.metaKey && !e.altKey &&
           (e.key.length===1 || e.keyCode===229 || e.key==='Process')){
          e.preventDefault();
          startEdit(selectedId,true);
        }
    }
  });

  // ---------- export helpers ----------
  function download(href,name){ const a=document.createElement('a'); a.href=href; a.download=name; a.click(); }
  function safeName(){ return (root.text||'mindmap').replace(/[^\w가-힣\- ]/g,'').slice(0,30)||'mindmap'; }
  function cssVar(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
  function levelOf(n){ let l=0,p=parentIndex.get(n.id); while(p){l++;p=parentIndex.get(p.id);} return l; }

  function exportJSON(){
    const data=JSON.stringify({app:'MindFlow',version:2,name:store.maps[store.current].name,root,uid},null,2);
    download(URL.createObjectURL(new Blob([data],{type:'application/json'})), safeName()+'.json');
  }

  function nodeStyleFor(n,isRoot,lvl){
    return {
      fill: isRoot? null : cssVar('--panel'),
      border: isRoot? 'transparent' : (n.color||cssVar('--line')),
      color: isRoot? '#ffffff' : cssVar('--text'),
      radius: isRoot?16:12
    };
  }
  function fontFor(isRoot,lvl){ return (isRoot?'bold 17px':(lvl===1?'600 14px':'normal 14px'))+' -apple-system,"Noto Sans KR",sans-serif'; }

  function exportPNG(){
    render();
    const b=world._bounds, pad=60, scale=2;
    const W=Math.ceil(b.maxX-b.minX+pad*2), H=Math.ceil(b.maxY-b.minY+pad*2);
    const cv=document.createElement('canvas'); cv.width=W*scale; cv.height=H*scale;
    const ctx=cv.getContext('2d'); ctx.scale(scale,scale);
    ctx.fillStyle=cssVar('--bg'); ctx.fillRect(0,0,W,H);
    ctx.translate(-b.minX+pad,-b.minY+pad);
    ctx.strokeStyle=cssVar('--conn'); ctx.lineWidth=2.4;
    computeLinks().forEach(s=>{ const mx=(s.px+s.cxp)/2; ctx.beginPath(); ctx.moveTo(s.px,s.py); ctx.bezierCurveTo(mx,s.py,mx,s.cyp,s.cxp,s.cyp); ctx.stroke(); });
    (function w(n){
      const isRoot=n===root, lvl=levelOf(n), st=nodeStyleFor(n,isRoot,lvl);
      roundRect(ctx,n._x,n._y,n._w,n._h,st.radius);
      if(isRoot){ const g=ctx.createLinearGradient(n._x,n._y,n._x+n._w,n._y+n._h); g.addColorStop(0,cssVar('--accent')); g.addColorStop(1,'#8a5cf6'); ctx.fillStyle=g; ctx.fill(); }
      else { ctx.fillStyle=st.fill; ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle=st.border; ctx.stroke(); }
      ctx.fillStyle=st.color; ctx.font=fontFor(isRoot,lvl); ctx.textBaseline='middle';
      const padX=isRoot?20:14;
      wrapText(ctx,n.text,n._x+padX,n._y,n._w-padX*2,n._h,(isRoot?17:14)*1.35);
      if(!n.collapsed) n.children.forEach(w);
    })(root);
    cv.toBlob(bl=>{ download(URL.createObjectURL(bl), safeName()+'.png'); }, 'image/png');
  }
  function roundRect(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function wrapText(ctx,text,x,y,maxW,boxH,lh){
    const lines=[];
    text.split('\n').forEach(para=>{
      let cur='';
      para.split('').forEach(ch=>{ const t=cur+ch; if(ctx.measureText(t).width>maxW && cur){ lines.push(cur); cur=ch; } else cur=t; });
      lines.push(cur);
    });
    const totalH=lines.length*lh; let cy=y+boxH/2-totalH/2+lh/2;
    lines.forEach(L=>{ ctx.fillText(L,x,cy); cy+=lh; });
  }

  function exportSVG(){
    render();
    const b=world._bounds,pad=40;
    const W=b.maxX-b.minX+pad*2, H=b.maxY-b.minY+pad*2, ox=-b.minX+pad, oy=-b.minY+pad;
    let s=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
    s+=`<rect width="${W}" height="${H}" fill="${cssVar('--bg')}"/>`;
    s+=`<defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${cssVar('--accent')}"/><stop offset="1" stop-color="#8a5cf6"/></linearGradient></defs>`;
    s+=`<g transform="translate(${ox},${oy})">`;
    computeLinks().forEach(seg=>{ const mx=(seg.px+seg.cxp)/2; s+=`<path d="M${seg.px},${seg.py} C${mx},${seg.py} ${mx},${seg.cyp} ${seg.cxp},${seg.cyp}" fill="none" stroke="${cssVar('--conn')}" stroke-width="2.4"/>`; });
    const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    (function w(n){
      const isRoot=n===root,lvl=levelOf(n),st=nodeStyleFor(n,isRoot,lvl);
      const fill=isRoot?'url(#rg)':st.fill, stroke=isRoot?'none':st.border;
      s+=`<rect x="${n._x}" y="${n._y}" width="${n._w}" height="${n._h}" rx="${st.radius}" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`;
      const fs=isRoot?17:14, fw=isRoot?'700':(lvl===1?'600':'400');
      s+=`<text x="${n._x+n._w/2}" y="${n._y+n._h/2}" fill="${st.color}" font-size="${fs}" font-weight="${fw}" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">${esc(n.text.split('\n')[0])}</text>`;
      if(!n.collapsed) n.children.forEach(w);
    })(root);
    s+='</g></svg>';
    download(URL.createObjectURL(new Blob([s],{type:'image/svg+xml'})), safeName()+'.svg');
  }

  function closeMenus(){ document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open')); }

  // ---------- toolbar ----------
  document.getElementById('addChild').onclick=addChild;
  document.getElementById('addSibling').onclick=addSibling;
  document.getElementById('del').onclick=delNode;
  document.getElementById('undo').onclick=undo;
  document.getElementById('redo').onclick=redo;
  document.getElementById('noteBtn').onclick=toggleNotes;
  document.getElementById('closeNote').onclick=closeNotes;
  document.getElementById('fit').onclick=fit;
  document.getElementById('fitBtn').onclick=fit;
  document.getElementById('mapsBtn').onclick=()=>{ if(mapsPinned) return; mapsOpen?(function(){mapsOpen=false;applyMaps();})():openMaps(); };
  document.getElementById('pinMaps').onclick=togglePin;
  document.getElementById('closeMaps').onclick=closeMaps;
  document.getElementById('newMapBtn').onclick=()=>{ const name=prompt('새 마인드맵 이름','마인드맵'); if(name===null)return; createMap(name.trim()||'마인드맵'); };
  document.getElementById('zoomIn').onclick=()=>{const r=stage.getBoundingClientRect();zoomTo(view.scale*1.15,r.left+r.width/2,r.top+r.height/2);};
  document.getElementById('zoomOut').onclick=()=>{const r=stage.getBoundingClientRect();zoomTo(view.scale/1.15,r.left+r.width/2,r.top+r.height/2);};
  document.getElementById('hintClose').onclick=()=>document.getElementById('hint').style.display='none';
  document.getElementById('theme').onclick=()=>{
    const html=document.documentElement, cur=html.getAttribute('data-theme')==='dark'?'':'dark';
    if(cur)html.setAttribute('data-theme','dark'); else html.removeAttribute('data-theme');
    localStorage.setItem('mindflow.theme',cur); requestAnimationFrame(render);
  };
  const exportBtn=document.getElementById('exportBtn'), exportMenu=document.getElementById('exportMenu');
  exportBtn.onclick=e=>{ e.stopPropagation(); exportMenu.classList.toggle('open'); };
  exportMenu.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{ exportMenu.classList.remove('open'); const a=btn.dataset.act; if(a==='png')exportPNG(); else if(a==='svg')exportSVG(); else exportJSON(); });
  document.addEventListener('mousedown',e=>{ if(!e.target.closest('#exportBtn')&&!e.target.closest('#exportMenu')) exportMenu.classList.remove('open'); });

  document.getElementById('importBtn').onclick=()=>document.getElementById('fileInput').click();
  document.getElementById('fileInput').addEventListener('change',e=>{
    const f=e.target.files[0]; if(!f)return; const r=new FileReader();
    r.onload=()=>{ try{ const o=JSON.parse(r.result); if(!o.root)throw 0;
      uid=o.uid||1; const id=mapId();
      store.maps[id]={id,name:o.name||o.root.text||'불러온 맵',root:o.root,uid,view:{x:0,y:0,scale:1},updated:Date.now()};
      store.order.unshift(id); loadMapInto(id); fit();
    }catch(err){ alert('불러올 수 없는 파일입니다.'); } };
    r.readAsText(f); e.target.value='';
  });

  // ---------- boot ----------
  function boot(){
    if(localStorage.getItem('mindflow.theme')==='dark') document.documentElement.setAttribute('data-theme','dark');
    const loaded=loadStore();
    if(loaded&&loaded.order&&loaded.order.length){ store=loaded; if(!store.maps[store.current]) store.current=store.order[0]; }
    else { const id=mapId(); uid=1; seed(); store={current:id,order:[id],maps:{[id]:{id,name:'시작 맵',root,uid,view:{x:0,y:0,scale:1},updated:Date.now()}}}; }
    const m=store.maps[store.current];
    root=m.root; uid=m.uid||1; view=m.view||{x:120,y:0,scale:1};
    reindex(); selectedId=root.id;
    history=[JSON.stringify({root,uid})]; hpos=0; updateUndoButtons();
    render();
    if(!localStorage.getItem('mindflow.seen')){ fit(); localStorage.setItem('mindflow.seen','1'); }
    select(root.id); renderMapName(); renderMapList(); persist();
    if(localStorage.getItem('mindflow.mapsPinned')==='1'){ mapsPinned=true; mapsOpen=true; renderMapList(); applyMaps(); }
  }
  boot();
  window.addEventListener('resize',applyView);
})();
</script>
</body>
</html>
