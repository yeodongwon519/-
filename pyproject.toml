[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoedit"
version = "0.1.0"
description = "Auto-edit one-take Korean Bitcoin market videos into a Premiere-ready FCPXML using a '다시' retake signal."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "faster-whisper>=1.0",
    "ffmpeg-python>=0.2",
    "opentimelineio>=0.17",
    "rapidfuzz>=3.9",
    "jamo>=0.4",
    "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
autoedit = "autoedit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/autoedit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
