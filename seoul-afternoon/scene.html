<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Seoul Afternoon</title>
<style>
  html,body{margin:0;background:#111;height:100%;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;object-fit:contain}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ---------------------------------------------------------------
// "Seoul Afternoon" — procedurally drawn & animated portrait.
// Everything is drawn with Canvas 2D; renderFrame(t) is deterministic.
// ---------------------------------------------------------------
const W = 1080, H = 1920, LOOP = 8.0;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- helpers ----------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const range = (t, a, b) => ease((t - a) / (b - a));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function smoothPath(pts, closed, tension = 0.5) {
  const n = pts.length;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  const get = i => pts[(i + n) % n];
  const last = closed ? n : n - 1;
  for (let i = 0; i < last; i++) {
    const p0 = closed ? get(i - 1) : pts[Math.max(i - 1, 0)];
    const p1 = pts[i];
    const p2 = closed ? get(i + 1) : pts[Math.min(i + 1, n - 1)];
    const p3 = closed ? get(i + 2) : pts[Math.min(i + 2, n - 1)];
    ctx.bezierCurveTo(p1[0] + (p2[0] - p0[0]) * tension / 3, p1[1] + (p2[1] - p0[1]) * tension / 3,
                      p2[0] - (p3[0] - p1[0]) * tension / 3, p2[1] - (p3[1] - p1[1]) * tension / 3, p2[0], p2[1]);
  }
  if (closed) ctx.closePath();
}
function bez(p0, p1, p2, p3, t) {
  const mt = 1 - t;
  const x = mt*mt*mt*p0[0] + 3*mt*mt*t*p1[0] + 3*mt*t*t*p2[0] + t*t*t*p3[0];
  const y = mt*mt*mt*p0[1] + 3*mt*mt*t*p1[1] + 3*mt*t*t*p2[1] + t*t*t*p3[1];
  const dx = 3*mt*mt*(p1[0]-p0[0]) + 6*mt*t*(p2[0]-p1[0]) + 3*t*t*(p3[0]-p2[0]);
  const dy = 3*mt*mt*(p1[1]-p0[1]) + 6*mt*t*(p2[1]-p1[1]) + 3*t*t*(p3[1]-p2[1]);
  return [x, y, dx, dy];
}
// tapered ribbon along a cubic bezier; width profile w(t)
function ribbonPath(p0, p1, p2, p3, w0, w1, steps = 18, wcurve = 1) {
  const L = [], R = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const [x, y, dx, dy] = bez(p0, p1, p2, p3, t);
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len;
    const w = lerp(w0, w1, Math.pow(t, wcurve)) * 0.5;
    L.push([x + nx * w, y + ny * w]); R.push([x - nx * w, y - ny * w]);
  }
  ctx.beginPath(); ctx.moveTo(L[0][0], L[0][1]);
  for (let i = 1; i < L.length; i++) ctx.lineTo(L[i][0], L[i][1]);
  for (let i = R.length - 1; i >= 0; i--) ctx.lineTo(R[i][0], R[i][1]);
  ctx.closePath();
}
function withFilter(f, fn) { ctx.save(); ctx.filter = f; fn(); ctx.restore(); }
function ell(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, TAU); }

// ---------- static scene data ----------
const rnd = mulberry32(20260902);
const bokeh = [];
for (let i = 0; i < 34; i++) bokeh.push({ x: 520 + rnd() * 620, y: rnd() * 1300 - 100, r: 18 + rnd() * 62, a: 0.10 + rnd() * 0.22, spd: 6 + rnd() * 14, ph: rnd() * TAU, hue: rnd() });
const grain = document.createElement('canvas'); grain.width = grain.height = 256;
{ const g = grain.getContext('2d'); const id = g.createImageData(256, 256); const r2 = mulberry32(7);
  for (let i = 0; i < id.data.length; i += 4) { const v = 110 + r2() * 90 | 0; id.data[i] = id.data[i+1] = id.data[i+2] = v; id.data[i+3] = 255; }
  g.putImageData(id, 0, 0); }

// ---------- hair definitions (head-local px; head centre 0,0; y down) ----------
const rs = mulberry32(99);
// see-through bangs, swept slightly to the viewer's right
const BANGS = [];
for (let i = 0; i < 26; i++) {
  const u = i / 25;
  const x0 = lerp(-142, 142, u) + (rs() - 0.5) * 8;
  const edge = Math.abs(u - 0.5) * 2;
  const len = lerp(-74, -44, Math.pow(edge, 1.3)) + (rs() - 0.5) * 16;
  BANGS.push({
    x0, y0: -262 + edge * 30,
    x1: x0 * (1.18 + edge * 0.2) + 10 + (rs() - 0.5) * 10, y1: len,
    w0: 14 + rs() * 12, w1: 2.5 + rs() * 2.5, ph: rs() * TAU,
    col: ['#33201a', '#3d271f', '#4a3226', '#38231b'][i % 4], alpha: 0.5 + rs() * 0.4
  });
}
// face-framing front strands (drawn over face/body; same tone family as back hair)
const SIDES = [];
for (const s of [-1, 1]) {
  SIDES.push({ s, p: [[152, -190], [190, 0], [176, 330], [250, 760]], w0: 96, w1: 8, wc: 2.6, col: '#33201a', ph: 0.4 });
  SIDES.push({ s, p: [[164, -140], [244, 130], [280, 470], [300, 880]], w0: 96, w1: 8, wc: 2.6, col: '#3a251d', ph: 1.7 });
  SIDES.push({ s, p: [[122, -215], [168, -80], [176, 90], [158, 330]], w0: 26, w1: 4, wc: 1.6, col: '#422b21', ph: 2.9 });
}

// ---------- animation state ----------
function animState(t) {
  const tt = t % LOOP;
  const breath = Math.sin(tt * TAU / 4.2) * 4;
  const tilt = Math.sin(tt * 0.55) * 0.02 + range(tt, 1.4, 2.6) * -0.035;
  const gazeX = lerp(10, 0, range(tt, 1.5, 2.4));
  const gazeY = lerp(-2, 0, range(tt, 1.5, 2.4));
  const smile = range(tt, 2.6, 4.1);
  let blink = 0;
  for (const b of [0.9, 2.45, 4.9, 7.1]) { const d = tt - b; if (d > 0 && d < 0.26) blink = Math.max(blink, Math.sin(d / 0.26 * Math.PI)); }
  const zoom = lerp(1.0, 1.11, ease(tt / LOOP));
  const hair = y => Math.sin(tt * 1.35 + y * 0.004) * (2 + Math.max(y, 0) * 0.012);
  return { tt, breath, tilt, gazeX, gazeY, smile, blink, zoom, hair };
}

// ---------- background ----------
function drawBackground(st) {
  let g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#d9c2a6'); g.addColorStop(0.5, '#eed9bd'); g.addColorStop(1, '#c9a98a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.beginPath(); ctx.rect(560, 0, 520, 1180); ctx.clip();
  g = ctx.createLinearGradient(560, 0, 1080, 1180);
  g.addColorStop(0, '#fbeacb'); g.addColorStop(0.55, '#f6d9a8'); g.addColorStop(1, '#efc48a');
  ctx.fillStyle = g; ctx.fillRect(560, 0, 520, 1180);
  withFilter('blur(38px)', () => {
    ctx.fillStyle = 'rgba(140,160,90,0.55)'; ell(760, 180, 210, 150); ctx.fill();
    ctx.fillStyle = 'rgba(110,140,80,0.45)'; ell(1000, 380, 190, 220); ctx.fill();
    ctx.fillStyle = 'rgba(255,240,200,0.7)'; ell(880, 650, 260, 200); ctx.fill();
  });
  for (const b of bokeh) {
    const y = ((b.y - st.tt * b.spd) % 1400 + 1400) % 1400 - 100;
    const x = b.x + Math.sin(st.tt * 0.6 + b.ph) * 10;
    const col = b.hue < 0.5 ? '255,236,200' : '255,205,150';
    const rg = ctx.createRadialGradient(x, y, b.r * 0.55, x, y, b.r);
    rg.addColorStop(0, `rgba(${col},${b.a})`); rg.addColorStop(0.85, `rgba(${col},${b.a * 0.7})`); rg.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(x, y, b.r, 0, TAU); ctx.fill();
  }
  ctx.restore();
  ctx.fillStyle = '#8a6a4f';
  ctx.fillRect(540, 0, 24, 1180); ctx.fillRect(540, 1168, 540, 22); ctx.fillRect(800, 0, 14, 1180); ctx.fillRect(540, 560, 540, 14);
  ctx.fillStyle = 'rgba(255,230,190,0.5)'; ctx.fillRect(540, 1160, 540, 6);
  withFilter('blur(60px)', () => { ctx.fillStyle = 'rgba(255,214,150,0.35)'; ctx.fillRect(420, 0, 400, 1300); });
  g = ctx.createLinearGradient(0, 1500, 0, 1920);
  g.addColorStop(0, '#b78a63'); g.addColorStop(1, '#8c6446');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(0, 1560); ctx.quadraticCurveTo(540, 1490, 1080, 1560); ctx.lineTo(1080, 1920); ctx.lineTo(0, 1920); ctx.closePath(); ctx.fill();
}

function drawCoffee(st) {
  ctx.save(); ctx.translate(200, 1650); ctx.scale(1.35, 1.35); ctx.translate(-200, -1650);
  ctx.filter = 'blur(2px)';
  const cx = 200, cy = 1650;
  ctx.fillStyle = 'rgba(60,30,10,0.28)'; ell(cx + 20, cy + 62, 120, 26); ctx.fill();
  ctx.fillStyle = '#f5efe6'; ell(cx, cy + 50, 118, 26); ctx.fill();
  ctx.fillStyle = '#f8f3ea';
  ctx.beginPath(); ctx.moveTo(cx - 78, cy - 40); ctx.quadraticCurveTo(cx - 74, cy + 60, cx - 40, cy + 62); ctx.lineTo(cx + 40, cy + 62); ctx.quadraticCurveTo(cx + 74, cy + 60, cx + 78, cy - 40); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#f2ece2'; ctx.lineWidth = 16; ctx.beginPath(); ctx.arc(cx + 88, cy, 30, -Math.PI / 2, Math.PI / 2); ctx.stroke();
  ctx.fillStyle = '#efe8dc'; ell(cx, cy - 40, 80, 20); ctx.fill();
  ctx.fillStyle = '#5b3a24'; ell(cx, cy - 39, 68, 15); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; ell(cx - 20, cy - 43, 20, 5); ctx.fill();
  ctx.filter = 'blur(6px)';
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 12; ctx.lineCap = 'round';
  for (let i = 0; i < 3; i++) {
    const ph = st.tt * 0.9 + i * 2.1;
    ctx.beginPath();
    for (let k = 0; k <= 10; k++) { const u = k / 10; const y = cy - 60 - u * 150; const x = cx - 30 + i * 30 + Math.sin(ph + u * 4) * 16 * (0.3 + u); k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.globalAlpha = 0.5 * (0.6 + 0.4 * Math.sin(ph)); ctx.stroke();
  }
  ctx.restore();
}

// ---------- head geometry ----------
// right half of the face contour, chin -> forehead (mirrored for the left)
const FACE_R = [[0, 262], [30, 258], [82, 230], [122, 172], [144, 92], [152, 8], [150, -80], [138, -152], [110, -206], [60, -238], [0, -246]];
function facePts() {
  const L = FACE_R.slice(1, -1).reverse().map(p => [-p[0], p[1]]);
  return FACE_R.concat(L);
}
function facePath() { smoothPath(facePts(), true, 0.55); }

// ---------- hair ----------
function hairOutline(st) {
  const sw = st.hair;
  const right = [[0, -306], [110, -292], [196, -232], [232, -120], [240, 20], [250, 200], [290, 400], [340, 600], [378, 820], [370, 1020], [320, 1180]];
  const pts = [];
  for (const p of right) { const wave = p[1] > 150 ? Math.sin(p[1] * 0.012) * 14 : 0; pts.push([p[0] + wave + sw(p[1]), p[1]]); }
  pts.push([0, 1200]);
  for (let i = right.length - 1; i >= 1; i--) { const p = right[i]; const wave = p[1] > 150 ? Math.sin(p[1] * 0.012 + 1.3) * 14 : 0; pts.push([-p[0] - wave + sw(p[1]), p[1]]); }
  return pts;
}
function drawBackHair(st) {
  const pts = hairOutline(st);
  const g = ctx.createLinearGradient(-300, -300, 300, 900);
  g.addColorStop(0, '#311e16'); g.addColorStop(0.45, '#45291c'); g.addColorStop(1, '#2a1810');
  ctx.fillStyle = g; smoothPath(pts, true, 0.5); ctx.fill();
  ctx.save(); smoothPath(pts, true, 0.5); ctx.clip();
  // strand lines
  ctx.strokeStyle = 'rgba(130,85,58,0.18)'; ctx.lineWidth = 3;
  for (let i = -7; i <= 7; i++) {
    ctx.beginPath();
    for (let k = 0; k <= 14; k++) { const y = -300 + k * 110; const x = i * 40 * (1 + Math.max(y, 0) * 0.0006) + Math.sin(y * 0.01 + i) * 16 + st.hair(y); k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke();
  }
  // crown highlight + window rim light
  withFilter('blur(14px)', () => {
    ctx.strokeStyle = 'rgba(225,160,110,0.42)'; ctx.lineWidth = 22; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-130, -240); ctx.quadraticCurveTo(0, -318, 150, -238); ctx.stroke();
    ctx.fillStyle = 'rgba(255,200,140,0.5)'; ctx.fillRect(230, -320, 140, 1500);
  });
  ctx.restore();
}
function drawFrontHair(st) {
  const sw = st.hair;
  for (const h of SIDES) {
    const s = h.s, P = h.p;
    const dx = y => sw(y) * 1.1 + Math.sin(st.tt * 1.1 + h.ph) * 3;
    ctx.fillStyle = h.col;
    ribbonPath([s * P[0][0], P[0][1]], [s * P[1][0] + dx(P[1][1]) * 0.3, P[1][1]], [s * P[2][0] + dx(P[2][1]), P[2][1]], [s * P[3][0] + dx(P[3][1]) * 1.4, P[3][1]], h.w0, h.w1, 28, h.wc);
    ctx.fill();
    ctx.save(); ctx.clip();
    withFilter('blur(9px)', () => {
      ctx.fillStyle = s > 0 ? 'rgba(255,195,135,0.30)' : 'rgba(150,100,70,0.22)';
      ribbonPath([s * (P[0][0] + 6), P[0][1] + 80], [s * (P[1][0] + 12) + dx(P[1][1]) * 0.3, P[1][1] + 40], [s * (P[2][0] - 8) + dx(P[2][1]), P[2][1]], [s * P[3][0] + dx(P[3][1]) * 1.4, P[3][1] - 120], 14, 5, 14);
      ctx.fill();
    });
    ctx.restore();
  }
  // hairline shadow on the forehead under the bangs
  withFilter('blur(12px)', () => { ctx.fillStyle = 'rgba(90,50,35,0.35)'; ell(0, -165, 150, 40); ctx.fill(); });
  // crown mass (same gradient as back hair so it blends), natural hairline
  const g = ctx.createLinearGradient(-200, -310, 200, -150);
  g.addColorStop(0, '#311e16'); g.addColorStop(0.5, '#45291c'); g.addColorStop(1, '#311e16');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-200, -120); ctx.quadraticCurveTo(-190, -300, 0, -308); ctx.quadraticCurveTo(190, -300, 200, -120);
  ctx.quadraticCurveTo(178, -150, 150, -168); ctx.quadraticCurveTo(120, -192, 70, -206); ctx.quadraticCurveTo(0, -222, -70, -206); ctx.quadraticCurveTo(-120, -192, -150, -168); ctx.quadraticCurveTo(-178, -150, -200, -120);
  ctx.closePath(); ctx.fill();
  // see-through bangs veil
  ctx.save(); ctx.globalAlpha = 0.38; ctx.fillStyle = '#3a241c';
  ctx.beginPath(); ctx.moveTo(-150, -200); ctx.quadraticCurveTo(0, -262, 150, -200); ctx.quadraticCurveTo(150, -110, 120, -70); ctx.quadraticCurveTo(0, -92, -120, -76); ctx.quadraticCurveTo(-150, -120, -150, -170); ctx.closePath(); ctx.fill();
  ctx.restore();
  // bangs
  for (const b of BANGS) {
    const sway = Math.sin(st.tt * 1.35 + b.ph) * 2.2;
    ctx.save(); ctx.globalAlpha = b.alpha; ctx.fillStyle = b.col;
    ribbonPath([b.x0, b.y0], [b.x0 * 1.02 + 4, -170], [lerp(b.x0, b.x1, 0.8) + sway, -110], [b.x1 + sway * 1.6, b.y1], b.w0, b.w1, 16, 0.85);
    ctx.fill(); ctx.restore();
  }
  withFilter('blur(10px)', () => {
    ctx.strokeStyle = 'rgba(225,165,115,0.28)'; ctx.lineWidth = 22; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-120, -252); ctx.quadraticCurveTo(0, -300, 150, -246); ctx.stroke();
  });
  ctx.strokeStyle = 'rgba(70,45,32,0.5)'; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
  for (let k = 1; k < 6; k += 2) {
    const a = -0.35 + k * 0.12 + Math.sin(st.tt * 2 + k) * 0.03; const x0 = -60 + k * 22, y0 = -292;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo(x0 + Math.sin(a) * 40, y0 - 30, x0 + Math.sin(a) * 60 + Math.sin(st.tt + k) * 6, y0 - 22); ctx.stroke();
  }
}

// ---------- body ----------
function drawBody(st) {
  // neck
  ctx.fillStyle = '#f3d3bd';
  ctx.beginPath(); ctx.moveTo(-58, 190); ctx.lineTo(58, 190); ctx.quadraticCurveTo(62, 340, 84, 410); ctx.lineTo(-84, 410); ctx.quadraticCurveTo(-62, 340, -58, 190); ctx.closePath(); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.rect(-120, 180, 240, 240); ctx.clip();
  withFilter('blur(16px)', () => { ctx.fillStyle = 'rgba(150,80,60,0.45)'; ell(0, 250, 90, 60); ctx.fill(); });
  ctx.restore();
  // inner top
  ctx.fillStyle = '#fbf8f3';
  ctx.beginPath(); ctx.moveTo(-200, 440); ctx.quadraticCurveTo(0, 396, 200, 440); ctx.lineTo(240, 1300); ctx.lineTo(-240, 1300); ctx.closePath(); ctx.fill();
  withFilter('blur(4px)', () => { ctx.strokeStyle = 'rgba(170,110,90,0.3)'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(-130, 440); ctx.quadraticCurveTo(-60, 458, -18, 444); ctx.moveTo(130, 440); ctx.quadraticCurveTo(60, 458, 18, 444); ctx.stroke(); });
  // cardigan
  const side = s => {
    ctx.beginPath();
    ctx.moveTo(s * 84, 404);
    ctx.quadraticCurveTo(s * 170, 412, s * 262, 470);   // shoulder slope
    ctx.quadraticCurveTo(s * 330, 520, s * 352, 720);   // upper arm
    ctx.lineTo(s * 380, 1300); ctx.lineTo(s * 26, 1300);
    ctx.quadraticCurveTo(s * 26, 900, s * 34, 720);     // lapel inner edge
    ctx.quadraticCurveTo(s * 52, 560, s * 84, 404);
    ctx.closePath();
  };
  const cg = ctx.createLinearGradient(-400, 400, 400, 1300);
  cg.addColorStop(0, '#e4d5bd'); cg.addColorStop(0.5, '#f1e6d2'); cg.addColorStop(1, '#d9c7ad');
  for (const s of [-1, 1]) {
    ctx.fillStyle = cg; side(s); ctx.fill();
    ctx.save(); side(s); ctx.clip();
    ctx.strokeStyle = 'rgba(120,90,60,0.10)'; ctx.lineWidth = 3;
    for (let x = -420; x <= 420; x += 16) { ctx.beginPath(); ctx.moveTo(x, 380); ctx.lineTo(x + 10, 1300); ctx.stroke(); }
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2;
    for (let x = -412; x <= 420; x += 16) { ctx.beginPath(); ctx.moveTo(x, 380); ctx.lineTo(x + 10, 1300); ctx.stroke(); }
    withFilter('blur(22px)', () => {
      ctx.fillStyle = 'rgba(120,80,50,0.28)';
      ell(s * 300, 700, 70, 220); ctx.fill();
      ell(s * 110, 560, 50, 150, s * 0.4); ctx.fill();
      ctx.fillStyle = 'rgba(255,240,215,0.5)'; ell(s * 220, 520, 60, 120, s * -0.3); ctx.fill();
    });
    ctx.strokeStyle = 'rgba(120,90,60,0.22)'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(s * 84, 404); ctx.quadraticCurveTo(s * 52, 560, s * 34, 720); ctx.quadraticCurveTo(s * 26, 900, s * 26, 1300); ctx.stroke();
    ctx.restore();
  }
  for (const y of [800, 910, 1020]) {
    ctx.fillStyle = '#c9b191'; ctx.beginPath(); ctx.arc(0, y, 11, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.beginPath(); ctx.arc(-3, y - 3, 4.5, 0, TAU); ctx.fill();
  }
}

// ---------- face ----------
function drawEar(s) {
  ctx.fillStyle = '#f0ccb6'; ell(s * 156, 30, 22, 40, s * 0.12); ctx.fill();
  ctx.fillStyle = 'rgba(200,120,100,0.35)'; ell(s * 158, 34, 12, 24); ctx.fill();
}

function drawEye(s, st) {
  const cx = s * 78, cy = 14;
  const inner = [s * 36, 22], outer = [s * 124, 6];
  const open = 1 - st.blink;
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(1, Math.max(open, 0.05)); ctx.translate(-cx, -cy);
  const eyeShape = () => {
    ctx.beginPath(); ctx.moveTo(inner[0], inner[1]);
    ctx.quadraticCurveTo(s * 52, -18, s * 80, -18);
    ctx.quadraticCurveTo(s * 108, -18, outer[0], outer[1]);
    ctx.quadraticCurveTo(s * 106, 34, s * 78, 34);
    ctx.quadraticCurveTo(s * 50, 34, inner[0], inner[1]);
    ctx.closePath();
  };
  eyeShape(); ctx.fillStyle = '#fcf8f5'; ctx.fill();
  ctx.save(); eyeShape(); ctx.clip();
  withFilter('blur(6px)', () => { ctx.fillStyle = 'rgba(120,80,70,0.38)'; ctx.fillRect(s * 20 - 60, -34, 180, 20); });
  const ix = cx + st.gazeX, iy = cy + st.gazeY;
  const R = 25;
  const ig = ctx.createRadialGradient(ix, iy, 2, ix, iy, R);
  ig.addColorStop(0, '#5c3722'); ig.addColorStop(0.5, '#3b2115'); ig.addColorStop(0.88, '#20110b'); ig.addColorStop(1, '#130905');
  ctx.fillStyle = ig; ctx.beginPath(); ctx.arc(ix, iy, R, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(215,145,95,0.3)'; ctx.lineWidth = 1.3;
  for (let k = 0; k < 28; k++) { const a = k / 28 * TAU; ctx.beginPath(); ctx.moveTo(ix + Math.cos(a) * 9, iy + Math.sin(a) * 9); ctx.lineTo(ix + Math.cos(a) * (R - 3), iy + Math.sin(a) * (R - 3)); ctx.stroke(); }
  ctx.fillStyle = '#0b0604'; ctx.beginPath(); ctx.arc(ix, iy, 9.5, 0, TAU); ctx.fill();
  // catchlights
  ctx.fillStyle = 'rgba(255,255,255,0.96)'; ctx.beginPath(); ctx.arc(ix + 8, iy - 9, 6, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.beginPath(); ctx.arc(ix - 8, iy + 8, 3, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,225,190,0.35)'; ctx.beginPath(); ctx.arc(ix - 5, iy + 12, 8, 0, TAU); ctx.fill();
  // eyelid shadow over the top of the iris
  withFilter('blur(4px)', () => { ctx.fillStyle = 'rgba(40,20,15,0.35)'; ctx.fillRect(s * 20 - 60, -30, 180, 14); });
  ctx.restore();

  // upper lash line
  ctx.strokeStyle = '#231410'; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(inner[0] - s * 2, inner[1] - 2); ctx.quadraticCurveTo(s * 50, -21, s * 80, -21); ctx.quadraticCurveTo(s * 110, -21, outer[0] + s * 4, outer[1] - 5); ctx.stroke();
  ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(outer[0] - s * 3, outer[1] - 4); ctx.quadraticCurveTo(outer[0] + s * 9, outer[1] - 7, outer[0] + s * 18, outer[1] - 14); ctx.stroke();
  ctx.lineWidth = 2.2;
  for (let k = 0; k < 6; k++) {
    const u = 0.55 + k * 0.08; const bx = lerp(inner[0], outer[0], u), by = -21 + Math.pow(Math.abs(u - 0.5) * 2, 2) * 18;
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + s * 5, by - 11 - (5 - k)); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(60,35,25,0.5)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(s * 66, 35); ctx.quadraticCurveTo(s * 104, 36, outer[0], outer[1] + 3); ctx.stroke();
  ctx.restore();

  // crease + soft under-eye highlight
  ctx.strokeStyle = 'rgba(120,70,55,0.3)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(s * 46, -22 * open - 6); ctx.quadraticCurveTo(s * 80, -34 * open - 6, s * 122, -12 * open - 9); ctx.stroke();
  withFilter('blur(6px)', () => { ctx.fillStyle = 'rgba(255,238,225,0.6)'; ell(s * 80, 46, 36, 9); ctx.fill(); });
  if (st.blink > 0.9) { ctx.strokeStyle = '#231410'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(inner[0], inner[1]); ctx.quadraticCurveTo(s * 80, 24, outer[0] + s * 6, outer[1] - 2); ctx.stroke(); }
}

function drawBrow(s) {
  ctx.save(); ctx.filter = 'blur(0.8px)';
  ctx.fillStyle = 'rgba(60,42,32,0.85)';
  ctx.beginPath();
  ctx.moveTo(s * 38, -48);
  ctx.quadraticCurveTo(s * 78, -62, s * 126, -56);
  ctx.quadraticCurveTo(s * 132, -53, s * 126, -50);
  ctx.quadraticCurveTo(s * 82, -51, s * 44, -41);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(60,42,32,0.45)'; ctx.lineWidth = 1.4;
  for (let k = 0; k < 16; k++) { const u = k / 15; const x = lerp(s * 40, s * 124, u); const y = lerp(-44, -55, u) - Math.sin(u * Math.PI) * 4; ctx.beginPath(); ctx.moveTo(x, y + 4); ctx.lineTo(x + s * 3, y - 6); ctx.stroke(); }
  ctx.restore();
}

function drawNose() {
  withFilter('blur(8px)', () => {
    ctx.fillStyle = 'rgba(170,100,80,0.18)'; ell(-12, 48, 9, 50); ctx.fill();
    ctx.fillStyle = 'rgba(255,245,235,0.55)'; ell(4, 36, 6, 48); ctx.fill();
    ctx.fillStyle = 'rgba(170,95,80,0.30)'; ell(0, 104, 24, 8); ctx.fill();
  });
  ctx.strokeStyle = 'rgba(150,85,70,0.5)'; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-15, 90); ctx.quadraticCurveTo(-17, 100, -7, 101); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(15, 90); ctx.quadraticCurveTo(17, 100, 7, 101); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-5, 99); ctx.quadraticCurveTo(0, 103, 5, 99); ctx.stroke();
  ctx.fillStyle = 'rgba(255,240,230,0.6)'; ell(2, 88, 7, 5); ctx.fill();
}

function drawLips(st) {
  const s = st.smile;
  const cw = 38 + 10 * s, cy = 166 - 10 * s, y0 = 166;
  const up = () => {
    ctx.beginPath(); ctx.moveTo(-cw, cy);
    ctx.quadraticCurveTo(-26, y0 - 12, -13, y0 - 9); ctx.quadraticCurveTo(-5, y0 - 7, 0, y0 - 5); ctx.quadraticCurveTo(5, y0 - 7, 13, y0 - 9); ctx.quadraticCurveTo(26, y0 - 12, cw, cy);
    ctx.quadraticCurveTo(14, y0 + 4 + 4 * s, 0, y0 + 4 + 4 * s); ctx.quadraticCurveTo(-14, y0 + 4 + 4 * s, -cw, cy); ctx.closePath();
  };
  const low = () => {
    ctx.beginPath(); ctx.moveTo(-cw, cy);
    ctx.quadraticCurveTo(-16, y0 + 4 + 4 * s, 0, y0 + 4 + 4 * s); ctx.quadraticCurveTo(16, y0 + 4 + 4 * s, cw, cy);
    ctx.quadraticCurveTo(24, y0 + 26 + 4 * s, 0, y0 + 28 + 3 * s); ctx.quadraticCurveTo(-24, y0 + 26 + 4 * s, -cw, cy); ctx.closePath();
  };
  withFilter('blur(3px)', () => { ctx.fillStyle = '#d97a80'; up(); ctx.fill(); low(); ctx.fill(); });
  ctx.fillStyle = '#d3707a'; up(); ctx.fill();
  const lg = ctx.createLinearGradient(0, y0, 0, y0 + 30); lg.addColorStop(0, '#dc7a83'); lg.addColorStop(1, '#ea979c');
  ctx.fillStyle = lg; low(); ctx.fill();
  if (s > 0.35) {
    ctx.save(); ctx.globalAlpha = range(s, 0.35, 0.9); ctx.fillStyle = '#fbfaf6';
    ctx.beginPath(); ctx.moveTo(-22, y0 + 3 + 2 * s); ctx.quadraticCurveTo(0, y0 + 8 * s, 22, y0 + 3 + 2 * s); ctx.quadraticCurveTo(0, y0 + 10 + 6 * s, -22, y0 + 3 + 2 * s); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.strokeStyle = 'rgba(120,45,55,0.75)'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-cw, cy); ctx.quadraticCurveTo(-14, y0 + 5 + 5 * s, 0, y0 + 5 + 5 * s); ctx.quadraticCurveTo(14, y0 + 5 + 5 * s, cw, cy); ctx.stroke();
  withFilter('blur(3px)', () => { ctx.fillStyle = 'rgba(255,240,235,0.6)'; ell(4, y0 + 16 + 3 * s, 14, 5); ctx.fill(); });
  if (s > 0.2) {
    ctx.strokeStyle = `rgba(160,95,80,${0.35 * s})`; ctx.lineWidth = 2.5;
    for (const k of [-1, 1]) { ctx.beginPath(); ctx.moveTo(k * (cw + 6), cy - 4); ctx.quadraticCurveTo(k * (cw + 14), cy + 6, k * (cw + 8), cy + 18); ctx.stroke(); }
  }
  withFilter('blur(2px)', () => { ctx.fillStyle = 'rgba(255,245,238,0.7)'; ell(0, y0 - 17, 10, 4); ctx.fill(); });
}

function drawFace(st) {
  facePath();
  const sg = ctx.createLinearGradient(-160, -250, 160, 260);
  sg.addColorStop(0, '#f1cdb7'); sg.addColorStop(0.5, '#f8dfcc'); sg.addColorStop(1, '#f5d5c0');
  ctx.fillStyle = sg; ctx.fill();
  ctx.save(); facePath(); ctx.clip();
  withFilter('blur(28px)', () => {
    ctx.fillStyle = 'rgba(175,105,85,0.30)'; ell(-170, 40, 80, 320); ctx.fill();        // shadow side
    ctx.fillStyle = 'rgba(180,110,90,0.20)'; ell(0, 240, 120, 40); ctx.fill();          // under chin
    ctx.fillStyle = 'rgba(175,105,85,0.22)'; ell(-118, 130, 40, 70, 0.5); ctx.fill();   // cheekbone contour
    ctx.fillStyle = 'rgba(175,105,85,0.14)'; ell(118, 130, 40, 70, -0.5); ctx.fill();
    ctx.fillStyle = 'rgba(255,248,240,0.55)'; ell(100, 70, 44, 52); ctx.fill();        // cheek light
    ell(-60, -130, 60, 40); ctx.fill(); ell(0, 222, 26, 16); ctx.fill();
  });
  withFilter('blur(16px)', () => {
    ctx.fillStyle = `rgba(240,120,125,${0.20 + 0.1 * st.smile})`;
    ell(-100, 88, 52, 30, 0.15); ctx.fill(); ell(100, 88, 52, 30, -0.15); ctx.fill();
  });
  withFilter('blur(10px)', () => { ctx.strokeStyle = 'rgba(255,220,180,0.75)'; ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(150, -70); ctx.quadraticCurveTo(162, 90, 110, 210); ctx.stroke(); });
  ctx.restore();
  drawBrow(-1); drawBrow(1);
  drawEye(-1, st); drawEye(1, st);
  drawNose();
  drawLips(st);
}

function drawEarrings(st) {
  for (const s of [-1, 1]) {
    const sway = Math.sin(st.tt * 1.35 + s) * 1.5;
    ctx.strokeStyle = '#d6c39c'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(s * 162, 60); ctx.lineTo(s * 162 + sway, 88); ctx.stroke();
    const pg = ctx.createRadialGradient(s * 159 + sway, 92, 1, s * 162 + sway, 96, 9);
    pg.addColorStop(0, '#ffffff'); pg.addColorStop(0.6, '#f1eae0'); pg.addColorStop(1, '#c9b8a0');
    ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(s * 162 + sway, 96, 8.5, 0, TAU); ctx.fill();
  }
}

function drawCaption(st) {
  const a = range(st.tt, 0.6, 1.6) * (1 - range(st.tt, 7.2, 7.9));
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(255,250,240,0.9)';
  ctx.font = '300 26px "DejaVu Serif", Georgia, serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.letterSpacing = '8px';
  ctx.fillText('SEOUL, 4 PM', 84, 1840);
  ctx.fillStyle = 'rgba(255,250,240,0.55)'; ctx.fillRect(84, 1852, 120 * a, 2);
  ctx.restore();
}

function post(st) {
  ctx.save();
  ctx.globalCompositeOperation = 'soft-light'; ctx.fillStyle = 'rgba(255,190,120,0.35)'; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';
  const vg = ctx.createRadialGradient(540, 860, 500, 540, 900, 1250);
  vg.addColorStop(0, 'rgba(40,20,10,0)'); vg.addColorStop(1, 'rgba(40,20,10,0.55)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  withFilter('blur(70px)', () => { ctx.globalCompositeOperation = 'screen'; ctx.fillStyle = 'rgba(255,205,150,0.28)'; ell(920, 520, 260, 420); ctx.fill(); });
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.16;
  const gr = mulberry32(1000 + Math.floor(st.tt * 30));
  const ox = -Math.floor(gr() * 256), oy = -Math.floor(gr() * 256);
  for (let y = oy; y < H; y += 256) for (let x = ox; x < W; x += 256) ctx.drawImage(grain, x, y);
  ctx.restore();
}

function renderFrame(t) {
  const st = animState(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.filter = 'none'; ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, W, H);
  ctx.translate(540, 940); ctx.scale(st.zoom, st.zoom); ctx.translate(-540, -940);
  drawBackground(st);
  ctx.save();
  ctx.translate(540, 830 + st.breath);
  ctx.save(); ctx.rotate(st.tilt * 0.6); drawBackHair(st); ctx.restore();
  ctx.save(); ctx.translate(0, -st.breath * 0.4); drawBody(st); ctx.restore();
  ctx.save(); ctx.rotate(st.tilt);
  drawEar(-1); drawEar(1);
  drawFace(st);
  drawFrontHair(st);
  drawEarrings(st);
  ctx.restore();
  ctx.restore();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawCoffee(st);
  post(st);
  drawCaption(st);
}
window.renderFrame = renderFrame;
window.LOOP = LOOP;
if (!location.search.includes('capture')) {
  const t0 = performance.now();
  (function loop() { renderFrame((performance.now() - t0) / 1000); requestAnimationFrame(loop); })();
}
</script>
